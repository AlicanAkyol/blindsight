[project]
name = "blindsight"
version = "0.4.0"
description = "Adversarial benchmark and harness for LLM-assisted reverse engineering setups"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ghidra = [
    # GhidraMCP 2.0 (tag 2.0), pinned by commit for reproducible runs.
    "ghidra-mcp[headless] @ git+https://github.com/LaurieWired/GhidraMCP@1e980252087b2479a21b9ca6d82d5829538651a7",
    "mcp",
]

[project.scripts]
ral = "blindsight.product:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blindsight", "blindsight.runner", "blindsight.evaluator", "blindsight.corpus"]
package-dir = {blindsight = "."}
include-package-data = false

[tool.setuptools.package-data]
blindsight = ["ral.yaml", "docker/Dockerfile", "docker/Dockerfile.trace"]
"blindsight.corpus" = ["scenarios/*.yaml", "src/*.c", "variants/*/variant.h", "variants/*/SRC", "artifacts/*.json", "artifacts/*/agent_fixture", "artifacts/*/health_fixture"]
