[project]
name = "re-agent-lab"
version = "0.3.0"
description = "Adversarial benchmark and harness for LLM-assisted reverse engineering setups"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ghidra = [
    # GhidraMCP 2.0 (tag 2.0), pinned by commit for reproducible runs.
    "ghidra-mcp[headless] @ git+https://github.com/LaurieWired/GhidraMCP@1e980252087b2479a21b9ca6d82d5829538651a7",
    "mcp",
]

[project.scripts]
ral = "re_agent_lab.product:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["re_agent_lab", "re_agent_lab.runner", "re_agent_lab.evaluator", "re_agent_lab.corpus"]
package-dir = {re_agent_lab = "."}
include-package-data = false

[tool.setuptools.package-data]
re_agent_lab = ["ral.yaml", "docker/Dockerfile", "docker/Dockerfile.trace"]
"re_agent_lab.corpus" = ["scenarios/*.yaml", "src/*.c", "variants/*/variant.h", "variants/*/SRC", "artifacts/*.json", "artifacts/*/agent_fixture", "artifacts/*/health_fixture"]
