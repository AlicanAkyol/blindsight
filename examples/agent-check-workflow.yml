# After public release, a versioned uses: AlicanAkyol/re-agent-lab@vX can
# replace the local action. This example assumes RAL is checked out at tools/ral.
name: Check RE agent
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install YOUR local agent and its dependencies here.
      # The adapter must invoke your real agent, not a fixed-answer stub.
      - uses: ./tools/ral
        id: ral
        with:
          target-command: python adapters/my_agent.py
          suite: quick
      - uses: actions/upload-artifact@v4
        if: always() && steps.ral.outputs.reports != ''
        with:
          name: ral-report
          path: ${{ steps.ral.outputs.reports }}
