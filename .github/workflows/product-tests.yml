name: Installed CLI tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel in isolated environment
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv /tmp/ral-test
          /tmp/ral-test/bin/python -m pip install dist/*.whl
      - name: Exercise installed CLI outside checkout
        run: |
          /tmp/ral-test/bin/python tests/test_product.py
          /tmp/ral-test/bin/python tests/test_release.py
      - name: Existing statistics and gate tests
        run: |
          /tmp/ral-test/bin/python tests/test_stats.py
          /tmp/ral-test/bin/python tests/test_cli.py
